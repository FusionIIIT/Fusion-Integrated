name: One-time IAA OpenAPI generation
on:
  push:
    branches: [iaa-implementation-v2]
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      IAM_SERVICE_TOKEN: ci
      PLACEMENT_UPLOAD_ROOT: /tmp/ci-uploads
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      REDIS_BROKER_URL: redis://127.0.0.1:6380/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fusion_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fusion_integrated
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fusion_admin -d fusion_integrated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iaa-implementation-v2
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Generate OpenAPI from current routes and serializers
        run: .venv/bin/python manage.py spectacular --fail-on-warn --file openapi/fusion-integrated.v1.yaml
      - name: Commit generated schema
        run: |
          if git diff --quiet -- openapi/fusion-integrated.v1.yaml; then
            echo "OpenAPI already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/fusion-integrated.v1.yaml
          git commit -m "Regenerate OpenAPI schema for IAA routes"
          git push origin iaa-implementation-v2
