name: E2E

# The whole stack, as Fusion-README's quickstart builds it: the public
# fusion-dev.dump, the IAM, this backend, then Playwright against the client.
on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fusion_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      PGHOST: 127.0.0.1
      PGUSER: fusion_admin
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FusionIIIT/Fusion_System_Administrator
          path: iam
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Databases from the public dev dump
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fusion-dev.dump" \
            https://github.com/FusionIIIT/Fusion-README/raw/main/fusion-dev.dump
          createdb fusionlab
          createdb fusion_system_db
          createdb fusion_integrated
          pg_restore -d fusionlab --no-owner "$RUNNER_TEMP/fusion-dev.dump"

      - name: IAM
        working-directory: iam
        run: |
          cat > .env <<EOF
          SECRET_KEY=ci-only-secret-0123456789abcdef0123456789
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          DB_NAME=fusionlab
          DB_USER=fusion_admin
          DB_PASSWORD=postgres
          DB_HOST=127.0.0.1
          DB_PORT=5432
          SYSTEM_DB_NAME=fusion_system_db
          SYSTEM_DB_USER=fusion_admin
          SYSTEM_DB_PASSWORD=postgres
          SYSTEM_DB_HOST=127.0.0.1
          SYSTEM_DB_PORT=5432
          AUTH_COOKIE_NAME=auth_token
          AUTH_COOKIE_PATH=/
          AUTH_COOKIE_SAMESITE=Lax
          TOKEN_TTL_HOURS=8
          APP_BASE_PATH=/
          EOF
          uv venv --python 3.12 Backend/venv
          uv pip install --python Backend/venv/bin/python -r Backend/requirements.txt
          cd Backend/backend
          ../venv/bin/python manage.py migrate
          ../venv/bin/python manage.py migrate --database system_db
          ../venv/bin/python manage.py sync_identity
          token=$(../venv/bin/python manage.py service_token --issue fusion-integrated \
            | grep -o 'fsvc_[A-Za-z0-9_-]*' | head -1)
          echo "::add-mask::$token"
          echo "IAM_SERVICE_TOKEN=$token" >> "$GITHUB_ENV"
          nohup ../venv/bin/python manage.py runserver 127.0.0.1:8001 --noreload \
            > "$RUNNER_TEMP/iam.log" 2>&1 &

      - name: Fusion-Integrated
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DB_NAME: fusion_integrated
          DB_USER: fusion_admin
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          IAM_BASE_URL: http://127.0.0.1:8001
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          .venv/bin/python manage.py migrate
          .venv/bin/python manage.py seed_modules
          .venv/bin/python manage.py permission_manifest
          (cd iam/Backend/backend && ../venv/bin/python manage.py seed_iam_permissions \
            --manifest "$GITHUB_WORKSPACE/registry/permissions.json")
          nohup .venv/bin/python manage.py runserver 127.0.0.1:8002 --noreload \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8001/api/iam/v1/me
          curl -s -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8002/api/v1/me

      - name: Browser tests
        working-directory: client
        env:
          E2E_IAM_DIR: ${{ github.workspace }}/iam
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Keep the report and server logs
        if: failure()
        run: cp "$RUNNER_TEMP"/*.log client/test-results/ 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
