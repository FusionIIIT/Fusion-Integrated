# nginx for fusion-platform: the SPA as static files, the API over a socket.
#
#   cp ops/nginx/fusion-platform.conf /etc/nginx/sites-available/
#   ln -s ../sites-available/fusion-platform.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Sharing a server block with the legacy monolith is what makes location order
# load-bearing: an unanchored prefix here can shadow `/` and take the ERP down.
# Every deploy's smoke test asserts the legacy app still answers.

upstream fusion_platform {
    server unix:/run/fusion/platform.sock fail_timeout=0;
}

server {
    listen 80;
    server_name fusion.iiitdmj.ac.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fusion.iiitdmj.ac.in;

    ssl_certificate     /etc/letsencrypt/live/fusion.iiitdmj.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fusion.iiitdmj.ac.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS is also set by Django; nginx repeats it for the static responses,
    # which never reach the application.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 2m;
    root /srv/fusion/platform/current/client/dist;
    index index.html;

    access_log /var/log/nginx/fusion-platform.access.log;
    error_log  /var/log/nginx/fusion-platform.error.log;

    # Trailing-slash-bounded so /api/v1x cannot match, and the regex form keeps
    # this from shadowing anything else the server block serves.
    location ^~ /api/v1/ {
        include proxy_params;
        proxy_pass http://fusion_platform;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    location = /healthz { include proxy_params; proxy_pass http://fusion_platform; access_log off; }
    location = /readyz  { include proxy_params; proxy_pass http://fusion_platform; }

    location ^~ /api/schema { include proxy_params; proxy_pass http://fusion_platform; }
    location ^~ /api/docs   { include proxy_params; proxy_pass http://fusion_platform; }

    # Reached only through X-Accel-Redirect from the authorising view, never by a
    # client. PLACEMENT_UPLOAD_INTERNAL_PREFIX must be "/_protected/".
    location /_protected/ {
        internal;
        alias /var/lib/fusion/platform/media/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed filenames, so they can never be the stale half of a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cached, or a browser keeps loading the previous release's chunks.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Source maps are built but not published; they expose the full source.
    location ~* \.map$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
