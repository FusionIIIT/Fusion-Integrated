  /api/v1/placement/applications/bulk-transition:
    post:
      operationId: v1_placement_applications_bulk_transition_create
      description: |-
        Move several applications at once (PC-UC-008).

        Every item goes through the same service as a single transition, so the
        scope, permission, state machine and guards are identical. Partial success
        is reported rather than hidden.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTransition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkTransition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkTransition'
        required: true
      security:
      - recruiterSession: []
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
          description: ''
