openapi: 3.0.3
info:
  title: Fusion-Integrated API
  version: 1.0.0
  description: Non-academic platform. Independent modules, one login.
paths:
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: Sets the httpOnly session cookie. The token itself is never returned
        in the body.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/directory/users:
    get:
      operationId: v1_directory_users_retrieve
      description: |-
        Type-ahead over the local projection. Read-only by construction —
        directory data is owned by IAM and edited there.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResult'
          description: ''
  /api/v1/me:
    get:
      operationId: v1_me_retrieve
      description: |-
        The session payload the shell renders its sidebar from. `navigation`
        arrives already filtered, so the client cannot draw an ungranted module.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    patch:
      operationId: v1_me_partial_update
      description: Switch which designation the sidebar and screens present them as.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRole'
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/placement/announcements:
    get:
      operationId: v1_placement_announcements_list
      description: |-
        Recruiters authenticate on a separate scheme; both pools land on
        `request.principal`.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - recruiterSession: []
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
    post:
      operationId: v1_placement_announcements_create
      description: |-
        Recruiters authenticate on a separate scheme; both pools land on
        `request.principal`.
      tags:
      - v1
      requestBody:
