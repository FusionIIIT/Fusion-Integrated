            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDocument'
          description: ''
  /api/v1/placement/documents/{id}:
    delete:
      operationId: v1_placement_documents_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '204':
          description: No response body
  /api/v1/placement/documents/{id}/download:
    get:
      operationId: v1_placement_documents_download_retrieve
      description: |-
        Readable by the owner, by staff, and by a recruiter the owner has a
        live application with — the same scope that governs the profile.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - recruiterSession: []
      - iamSession: []
      responses:
        '302':
          description: Redirect to the document. The Drive URL is disclosed here and
            nowhere else.
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '404':
          description: Absent, or outside the caller's scope — the two are deliberately
            the same answer.
  /api/v1/placement/exports/applications.csv:
    get:
      operationId: v1_placement_exports_applications.csv_retrieve
      description: Every application in the caller's scope, one row each.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
        '403':
          description: Staff only; never a recruiter.
