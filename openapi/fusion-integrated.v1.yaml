          description: ''
  /api/v1/placement/conduct/mine:
    get:
      operationId: v1_placement_conduct_mine_list
      description: |-
        A student's own conduct record, in full.

        Rule 19 allows a waiver and rule 21 leaves a sanction to the Chairperson's
        discretion. Both are contestable, and nobody can contest what they cannot
        see — so the note and any waiver reason are shown, unlike an application's
        internal review note.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConductIncident'
          description: ''
  /api/v1/placement/conduct/sanctions:
    post:
      operationId: v1_placement_conduct_sanctions_create
      description: Impose the sanction. The human decision the policy calls for.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplySanction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplySanction'
          multipart/form-data:
            schema:
