      operationId: v1_placement_announcements_withdraw_create
      description: |-
        Recruiters authenticate on a separate scheme; both pools land on
        `request.principal`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Withdraw'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Withdraw'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Withdraw'
