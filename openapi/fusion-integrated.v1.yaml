openapi: 3.0.3
info:
  title: Fusion-Integrated API
  version: 1.0.0
  description: Non-academic platform. Independent modules, one login.
paths:
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: Sets the httpOnly session cookie. The token itself is never returned
        in the body.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/directory/users:
    get:
      operationId: v1_directory_users_retrieve
      description: |-
        Type-ahead over the local projection. Read-only by construction —
        directory data is owned by IAM and edited there.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResult'
          description: ''
  /api/v1/gymkhana/bookings:
    get:
      operationId: v1_gymkhana_bookings_list
      description: Bookings of clubs the caller leads or belongs to.
      parameters:
      - in: query
        name: club
        schema:
          type: integer
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGymkhanaBookingList'
              examples:
                Booking:
                  value:
                    next: http://api.example.org/accounts/?cursor=cD00ODY%3D"
                    previous: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
                    results:
                    - id: 9
                      club: 7
                      club_name: Robotics Club
                      kind: session
                      venue_name: LHTC 101
                      date: '2026-12-01'
                      start_time: '10:00:00'
                      end_time: '11:00:00'
                      description: Weekly build
                      poster_link: ''
                      event_name: ''
                      faculty_user_id: null
                      created_at: '2026-11-22T10:00:00+05:30'
                  summary: booking
          description: ''
