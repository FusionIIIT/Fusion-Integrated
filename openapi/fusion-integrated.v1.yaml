  /api/v1/placement/conduct/incidents/{id}/waive:
    post:
      operationId: v1_placement_conduct_incidents_waive_create
      description: Rule 19's written-notice exception.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
