components:
  schemas:
    AcademicDirectory:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AcademicStandingRow'
      required:
      - count
      - limit
      - offset
      - results
    AcademicFilters:
      type: object
      properties:
        disciplines:
          type: array
          items:
            type: string
        batch_years:
          type: array
          items:
            type: integer
        programmes:
          type: array
          items:
            type: string
      required:
      - batch_years
      - disciplines
      - programmes
    AcademicStandingRow:
      type: object
      description: |-
        One row of the CPI directory. `cpi` is null when nothing is declared —
        never zero.
      properties:
        user_id:
          type: integer
        roll_no:
          type: string
        name:
          type: string
        programme:
          type: string
        discipline:
          type: string
        batch_year:
          type: integer
          nullable: true
        cpi:
          type: string
          nullable: true
        semester:
          type: integer
          nullable: true
        semester_type:
          type: string
          nullable: true
        declared_seq:
          type: integer
          nullable: true
        earned_credits:
          type: string
          nullable: true
        active_backlogs:
          type: integer
          nullable: true
      required:
      - active_backlogs
      - batch_year
      - cpi
      - declared_seq
      - discipline
      - earned_credits
      - name
      - programme
      - roll_no
      - semester
      - semester_type
      - user_id
    AddCandidates:
      type: object
      properties:
        application_ids:
          type: array
          items:
            type: integer
          maxItems: 500
          minItems: 1
      required:
      - application_ids
    Adjust:
      type: object
      properties:
        delta:
          type: integer
        reason:
          type: string
          maxLength: 200
      required:
      - delta
      - reason
    Allot:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/_Room'
      required:
      - rooms
    Allotment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        room:
          allOf:
          - $ref: '#/components/schemas/Room'
          readOnly: true
        occupancy:
          allOf:
          - $ref: '#/components/schemas/OccupancyEnum'
          readOnly: true
        allotted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - allotted_at
      - id
      - occupancy
      - room
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        topic:
          allOf:
          - $ref: '#/components/schemas/TopicEnum'
          readOnly: true
        audience:
          allOf:
          - $ref: '#/components/schemas/AudienceEnum'
          readOnly: true
        placement_year:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        published_by_role:
          type: string
          readOnly: true
        is_withdrawn:
          type: boolean
          readOnly: true
        withdrawn_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - audience
      - body
      - created_at
      - id
      - is_withdrawn
      - placement_year
      - published_at
      - published_by_role
      - title
      - topic
      - withdrawn_reason
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        posting:
          allOf:
          - $ref: '#/components/schemas/JobPosting'
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cpi_at_apply:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        semester_at_apply:
          type: integer
          readOnly: true
          nullable: true
        eligibility_snapshot:
          readOnly: true
        cover_note:
          type: string
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        withdrawn_reason:
          type: string
          readOnly: true
        allowed_transitions:
          type: array
          items:
            type: string
          readOnly: true
        candidate:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Populated only when the view batch-loaded the directory, i.e. when
            the reader is staff. A student's own list needs no directory call.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - allowed_transitions
      - applied_at
      - candidate
      - cover_note
